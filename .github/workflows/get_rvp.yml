name: Download RVP and Put on Release
on:
  workflow_dispatch:
jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt install -y curl wget unzip zip

      - name: Download RVP
        run: |
          RVP_URL="https://www.dropbox.com/scl/fi/n1wzbj1lpxcosb0vp2swi/patches-5.7.1.rvp?rlkey=enltykklg7xjn60zrkr8vhsfg&st=qzh9prdh&dl=1"
          RVP_NAME=$(basename "${RVP_URL%%\?*}")
          wget -O "$RVP_NAME" "$RVP_URL"
          tree ./

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./*.rvp
          release_name: Patches 5.6.2_3
          tag: 5.6.2.3
          file_glob: true
          overwrite: true
