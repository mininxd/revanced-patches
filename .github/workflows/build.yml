name: Build and Release Artifact

on:
  workflow_dispatch:

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build and generate patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew assembleRelease build generatePatchesList --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p output
          find . -name "*.mpp" -exec cp {} output/ \;
          find . -name "*.mpe" -exec cp {} output/ \;
          find . -name "patches-list.json" -exec cp {} output/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morphe-build-artifacts
          path: output/
