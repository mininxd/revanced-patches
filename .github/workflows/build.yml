name: Build and Release Artifact

on:
  workflow_dispatch:

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build and generate class file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew build generatePatchesList --no-daemon --stacktrace

      - name: Zip compiled class files
        run: |
          tree ./ || true
          mkdir -p output
          zip -r output/javac-classes.zip ./patches/build/classes/kotlin/main/app/ || true

      - name: Upload javac zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: javac-compiled-classes
          path: output/javac-classes.zip
