name: Manual Build with Debug Info

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build with stacktrace, info, and scan
        run: ./gradlew -p patches build --stacktrace --info --scan

      - name: Generate patches
        run: ./gradlew -p patches generatePatchesFiles --stacktrace --info --scan

      - name: Publish to GitHub Packages
        run: ./gradlew -p patches publish --stacktrace --info --scan
        
